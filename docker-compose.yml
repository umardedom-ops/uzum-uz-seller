services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uzumbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD kerak}
      POSTGRES_DB: ${POSTGRES_DB:-uzumbot}
      TZ: Asia/Tashkent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Bot bazaga tayyor bo'lgandan keyingina ulanadi
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uzumbot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    command: ["bot"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-uzumbot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-uzumbot}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Excel/PDF/pretenziyalar — konteyner qayta yuklansa yo'qolmasin
      - generated:/app/generated
      # Maxfiy kalit fayllari (Google service account JSON va h.k.).
      # ❗ Aynan PAPKA ulanadi, fayl emas: yo'q faylni ulasak Docker uning
      # o'rniga papka yaratib qo'yadi va sozlash jimgina buziladi.
      # Faqat o'qish (`ro`) — konteyner kalitni o'zgartira olmaydi.
      - ./secrets:/app/secrets:ro

  web:
    build: .
    restart: unless-stopped
    command: ["web"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-uzumbot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-uzumbot}
      PORT: 8000
    depends_on:
      db:
        condition: service_healthy
      # Migratsiyani `bot` yuritadi — undan keyin ishga tushamiz
      bot:
        condition: service_started
    ports:
      # ❗ Faqat localhost. Tashqi dunyoga OCHILMAYDI: Traefik bu servisga
      # konteyner tarmog'i orqali yetadi (`http://uzumbot-web-1:8000`), host
      # porti orqali emas. Ilgari `0.0.0.0:8000` edi — ya'ni Click webhook'i
      # va `/health` HTTPS'ni chetlab, to'g'ridan-to'g'ri ochiq turardi.
      #
      # ⚠️ `ufw` bilan yopib bo'lmaydi: Docker `DOCKER-USER` zanjiri orqali
      # ufw qoidalarini chetlab o'tadi va port ochiq qolaveradi. Yagona
      # ishonchli yo'l — shu yerda 127.0.0.1 ga bog'lash.
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    networks:
      - default
      # Traefik shu tarmoq orqali yetib keladi va HTTPS beradi.
      # Click webhook'i faqat HTTPS bilan ishlaydi (SPEC Phase 6).
      - edge

volumes:
  pgdata:
  generated:

networks:
  default:
  edge:
    # Serverda allaqachon mavjud reverse-proxy tarmog'i. Biz yaratmaymiz —
    # `external` bo'lgani uchun mavjudiga ulanamiz.
    external: true
    name: ${EDGE_NETWORK:-easypanel}
